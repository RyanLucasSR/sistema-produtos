spring:
  application:
    name: produtos
  datasource:
    url: jdbc:mariadb://localhost:3306/produtos?createDataBaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true